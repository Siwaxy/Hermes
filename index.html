<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Rutas de viaje</title>
  <meta name="theme-color" content="#1f5fa8">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" crossorigin="">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="mapa"></div>

  <aside id="panel" aria-label="Viajes y rutas">
    <header class="panel-cab">
      <h1>Rutas de viaje</h1>
      <button type="button" id="btn-plegar" aria-expanded="true" aria-controls="panel-cuerpo">Ocultar</button>
    </header>
    <div id="panel-cuerpo">
      <div id="errores" role="alert" hidden></div>
      <div id="viajes"></div>
      <p class="leyenda"><span class="num" style="--c:#1f5fa8">1</span> parada <span class="num opc" style="--c:#1f5fa8">2</span> opcional (borde discontinuo)</p>
      <p class="herramientas"><a href="verificar.html">Verificar coordenadas</a></p>
    </div>
  </aside>

  <button type="button" id="btn-gps" aria-pressed="false"><span aria-hidden="true">◎</span> <span class="gps-texto">Ubicación</span></button>
  <div id="aviso" role="status" aria-live="polite" hidden></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" crossorigin=""></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
